{% extends 'base.html'%}
{% block content%}
   

<!-- Featured Image -->
<section class="container my-5">
    <div class="article-container row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">

                <img
                    src="{{post.img_url}}"
                    class="featured-image card-img-top img-fluid w-100 object-fit-cover"
                    style="max-height: 450px;"
                    alt="Laptop displaying a web development workspace"
                >

                <div class="card-body p-4 p-md-5 text-center">
                    <h3 class="text-secondary small text-center mt-2 fw-bold text-uppercase border-bottom pb-3 mb-3">
                        Title :- {{post.title}}
                    </h3>
                    <h4 class="text-secondary small text-center mt-2 lh-lg text-muted fw-normal">
                        Content :- {{post.content}}
                    </h4>
                </div>

            </div>
        </div>
    </div>
</section>



{% endblock%}
