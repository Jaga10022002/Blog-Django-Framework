{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBlog - Posts</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="{% static 'blog/style.css' %}">

    <style>
        body {
            background-color: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .navbar-brand {
            font-size: 27px;
            font-weight: bold;
        }

        .hero {
            background: linear-gradient(135deg, #e0eaff, #f8f9ff);
            padding: 65px 0;
        }

        .hero h1 {
            font-size: 45px;
            font-weight: 800;
        }

        .blog-card {
            border: none;
            border-radius: 16px;
            overflow: hidden;
            transition: 0.3s;
            height: 100%;
        }

        .blog-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
        }

        .blog-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .category {
            background-color: #e8edff;
            color: #3659c9;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .post-title {
            font-size: 21px;
            font-weight: bold;
        }

        .post-description {
            color: #6c757d;
            line-height: 1.7;
        }

        .author-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        footer {
            background-color: #ffffff;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
        <div class="container">
            <a class="navbar-brand text-primary" href="#">MyBlog</a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarMenu"
                    aria-controls="navbarMenu"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="#posts">Posts</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#about">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-primary rounded-pill px-4"
                           href="#posts">Explore Blogs</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

   {% comment %} dynamic content {% endcomment %}
   {% block content%}
   {%endblock%}

    <!-- Footer -->
    <footer class="border-top py-4 mt-4" id="about">
        <div class="container text-center">
            <h5 class="fw-bold text-primary">MyBlog.</h5>
            <p class="text-secondary mb-2">
                Sharing knowledge, one post at a time.
            </p>
            <small class="text-secondary">
                &copy; 2026 MyBlog. All rights reserved.
            </small>
        </div>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
