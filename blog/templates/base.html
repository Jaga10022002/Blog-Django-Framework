{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{blog_tit | default:"Document"}}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="{% static 'blog/style.css' %}">

    <style>
        body {
            background-color: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .navbar-brand {
            font-size: 27px;
            font-weight: bold;
        }

        .hero {
            background: linear-gradient(135deg, #e0eaff, #f8f9ff);
            padding: 65px 0;
        }

        .hero h1 {
            font-size: 45px;
            font-weight: 800;
        }

        .blog-card {
            border: none;
            border-radius: 16px;
            overflow: hidden;
            transition: 0.3s;
            height: 100%;
        }

        .blog-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
        }

        .blog-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .category {
            background-color: #e8edff;
            color: #3659c9;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .post-title {
            font-size: 21px;
            font-weight: bold;
        }

        .post-description {
            color: #6c757d;
            line-height: 1.7;
        }

        .author-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        footer {
            background-color: #ffffff;
        }
    </style>
</head>

<body>
    {% comment %} Header {% endcomment %}

    {% include 'includes/header.html'%}
  
   {% comment %} dynamic content {% endcomment %}
   {% block content%}
   {%endblock%}


   {% comment %} Footer partial template {% endcomment %}
   {% include 'includes/footer.html'%}
    
</body>
</html>
